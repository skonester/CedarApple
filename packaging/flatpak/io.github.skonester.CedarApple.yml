# Flatpak manifest for CedarApple, adapted from Vivi's
# (packaging/flatpak/io.github.loafer19.vivi.yml, MIT, Copyright (c) 2026 Ruslan
# Popelyshyn): the same libmpv modules, CedarApple's app module.
#
# cargo-sources.json (every crate, for the offline build) is generated from
# Cargo.lock, by the release workflow or by hand:
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
# (https://github.com/flatpak/flatpak-builder-tools, cargo/). Then:
#   flatpak-builder --user --install-deps-from=flathub --force-clean build-dir packaging/flatpak/io.github.skonester.CedarApple.yml
#   flatpak build-bundle repo cedarapple.flatpak io.github.skonester.CedarApple
#
# FFmpeg comes from the runtime; the runtime's org.freedesktop.Platform.codecs-extra
# extension (installed automatically with the runtime) adds the patent-encumbered
# codecs such as H.264/HEVC. libmpv is built here as a module (no mpv CLI).
id: io.github.skonester.CedarApple
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cedarapple
finish-args:
  - --share=ipc
  - --share=network # torrents, links, Free Music
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Files opened with Open file, and where Free Music saves downloads.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  # Discord Rich Presence: Discord's IPC socket (native and Flatpak Discord).
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --talk-name=org.freedesktop.ScreenSaver
  - --env=GTK_USE_PORTAL=1
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  - name: luajit # mpv's Lua scripts (CedarApple's spincard) need it
    no-autogen: true
    make-args: [PREFIX=/app]
    make-install-args: [PREFIX=/app]
    cleanup: [/bin]
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        commit: 2a8e017ef1ece6a95b983ffca073d30609dce7c4
      - type: shell
        commands:
          # LuaJIT derives its version from the git commit time; pin it for offline builds.
          - echo 1730000000 > .relver

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=OFF
      - -DBUILD_BINARY=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/uchardet/uchardet.git
        tag: v0.0.8

  - name: libass
    buildsystem: meson
    config-opts: [-Ddefault_library=shared]
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dopengl=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dtests=false
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dlua=luajit
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Dsdl2-audio=disabled
      - -Dsdl2-video=disabled
      - -Dpulse=enabled
      - -Dpipewire=enabled
      - -Dalsa=enabled
      - -Dvulkan=enabled
      - -Dvaapi=enabled
      - -Duchardet=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.40.0

  - name: cedarapple
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cedarapple/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBRARY_PATH: /app/lib # libmpv module
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --locked --verbose
      - install -Dm755 target/release/cedarapple /app/bin/cedarapple
      # mpv's config dir (spincard): src/player/mpv.rs looks in <bin>/../share/cedarapple/mpv.
      - mkdir -p /app/share/cedarapple && cp -r assets/mpv /app/share/cedarapple/mpv
      - install -Dm644 packaging/cedarapple.png /app/share/icons/hicolor/256x256/apps/io.github.skonester.CedarApple.png
      - sed 's/^Icon=cedarapple$/Icon=io.github.skonester.CedarApple/' packaging/cedarapple.desktop > io.github.skonester.CedarApple.desktop
      - install -Dm644 io.github.skonester.CedarApple.desktop /app/share/applications/io.github.skonester.CedarApple.desktop
      - install -Dm644 packaging/flatpak/io.github.skonester.CedarApple.metainfo.xml /app/share/metainfo/io.github.skonester.CedarApple.metainfo.xml
      - install -Dm644 -t /app/share/licenses/io.github.skonester.CedarApple LICENSE licenses/* vendor/README-librqbit.md
    sources:
      - type: dir
        path: ../..
        skip: [target, .git, build-dir, .flatpak-builder, repo, deps, deps-src, AppDir, dist]
      - cargo-sources.json
