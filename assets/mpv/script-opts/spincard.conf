# spincard options, as CedarApple ships it.
#
# EVERY image feature is off here, deliberately: spincard decodes artwork by
# shelling out to ffmpeg, which CedarApple does not bundle and does not expect
# on PATH. With these off nothing ever spawns ffmpeg, and the card renders as
# ASS text only (title, ratings, meta, synopsis, cast, tech pills, progress).
# Turn any of them back on only once ffmpeg is reachable from the app.
#
# Format: one option per line, comments on their OWN line - mpv keeps
# everything after the first '=' as the value, so a trailing "# note" ends up
# inside the value and a number/bool then fails to parse.

# --- ffmpeg-dependent: leave off ------------------------------------------
show_poster=no
show_fanart=no
show_banner=no
show_logo=no
show_disc=no
disc_spin=no
cast_headshots=no
# Remote art is fetched with curl but still DECODED with ffmpeg, so it is off
# too (it would also be a no-op with the show_* switches above off).
remote_art=no
fanart_tv_api_key=

# --- card behaviour --------------------------------------------------------
# CedarApple drives the card from its own UI (the info button / c / C), via
# `script-binding spincard/toggle`, so no key is bound here - keyboard input
# never reaches libmpv in an embedded player.
key=
lean_key=
# Show the card when a file opens, then close it after `duration` seconds
# (0 = stay until toggled). toggle_timeout does the same for the toggle key.
auto_show=yes
duration=7
toggle_timeout=17
# Pop the card while paused and hide it on resume.
show_on_pause=no
# Blocks the LEAN card (C) omits: overview, tagline, cast, tech, genres,
# awards, rating, meta.
lean_hide=overview

# --- placement -------------------------------------------------------------
# Top-right. "anchor" only picks the vertical edge (top = hug the top and grow
# down), so the horizontal side comes from pos_x, which is the card's LEFT edge
# in spincard's 1280x720 virtual space. The card box is 860 wide (CARD_W in
# scripts/spincard/layout.lua), so a 22px right margin is 1280 - 860 - 22 =
# 398. If CARD_W ever changes, this has to move with it.
#
# Top also keeps the card clear of CedarApple's transport bar, which Slint
# draws over the video along the bottom.
anchor=top
pos_x=398
pos_y=22
card_aspect=16:9

# --- text blocks -----------------------------------------------------------
# Codec / HDR / audio / subs / chapters + a live progress bar, all read from
# mpv itself - no external tools, works offline.
show_tech=yes
overview_scroll=yes
overview_lines=4
overview_scroll_mode=smooth
cast_scroll=yes
cast_scroll_dir=horizontal
cast_max=5

# --- online lookups (all optional, curl only) ------------------------------
# With no keys set the card is built from the local .nfo plus the filename,
# fully offline. curl ships with Windows (System32\curl.exe), so these need no
# extra binaries - only a key and a network.
enrich=yes
# TMDB: genres, cast, director, studio, tagline, runtime.
api_key=
# OMDb: IMDb / Rotten Tomatoes / Metacritic scores, awards, box office.
omdb_api_key=
language=en-US
rating_ttl=3600
nfo_supplement=yes
# Live TV via Tvheadend, e.g. http://127.0.0.1:9981 ("" = off).
tvheadend_url=
live_upcoming=7
